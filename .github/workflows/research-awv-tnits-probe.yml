name: Research AWV TN-ITS evidence probe

on:
  push:
    branches:
      - main
    paths:
      - "tools/v3/probe_official_evidence.py"
      - "tools/v3/probe-cases-20261012.json"
      - "tools/v3/PROBE-README.md"
      - "tools/v3/enrich_awv.py"
      - "tests/v3/test_awv.py"
      - "tools/v3/awv_osm_crosswalk.py"
      - "tests/v3/test_crosswalk.py"
      - "tools/v3/validate_live_crosswalk.py"
      - ".github/workflows/research-awv-tnits-probe.yml"
  pull_request:
    paths:
      - "tools/v3/probe_official_evidence.py"
      - "tools/v3/probe-cases-20261012.json"
      - "tools/v3/PROBE-README.md"
      - "tools/v3/enrich_awv.py"
      - "tests/v3/test_awv.py"
      - "tools/v3/awv_osm_crosswalk.py"
      - "tests/v3/test_crosswalk.py"
      - ".github/workflows/research-awv-tnits-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Run AWV and quality unit tests
        run: PYTHONPATH=tests/v3 python -m unittest tests.v3.test_awv tests.v3.test_quality tests.v3.test_crosswalk

  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check pyproj==3.8.0 shapely==2.1.2
      - name: Run read-only evidence probe
        id: probe
        continue-on-error: true
        run: python tools/v3/probe_official_evidence.py --config tools/v3/probe-cases-20261012.json --out probe-output > probe-output.log 2>&1
      - name: Show summary
        if: always()
        run: |
          cat probe-output.log || true
          test -f probe-output/summary.json && cat probe-output/summary.json || true
      - name: Upload raw evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awv-tnits-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-output/**
            probe-output.log
          retention-days: 14
      - name: Fail if probe reported source errors
        if: steps.probe.outcome != 'success'
        run: exit 1

  live_crosswalk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install crosswalk dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download live MotoLimiet v3 map
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir live-release
          gh release download map-v3-live --repo "$GITHUB_REPOSITORY" --dir live-release --pattern manifest.json --pattern 'belgium-limits-*.db.gz'
          cp live-release/manifest.json live-manifest.json
          map_asset=$(python -c 'import json, pathlib, urllib.parse; print(pathlib.PurePosixPath(urllib.parse.urlparse(json.load(open("live-manifest.json"))["url"]).path).name)')
          cp "live-release/$map_asset" live-map.db.gz
          python - <<'PYTHON'
          import gzip, shutil
          with gzip.open("live-map.db.gz","rb") as src, open("live-map.db","wb") as dst:
              shutil.copyfileobj(src,dst,1024*1024)
          PYTHON
      - name: Validate live Dendermonde and Wieze crosswalk
        run: PYTHONPATH=tools/v3 python tools/v3/validate_live_crosswalk.py live-map.db tools/v3/probe-cases-20261012.json live-crosswalk-report.json
      - name: Upload live crosswalk report
        uses: actions/upload-artifact@v4
        with:
          name: live-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-crosswalk-report.json
            live-manifest.json
          retention-days: 14

  candidate_build:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'candidate-crosswalk-zone30')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download current Belgium OSM extract
        run: curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 1800 --output belgium.osm.pbf https://download.geofabrik.de/europe/belgium-latest.osm.pbf
      - name: Download AWV snapshot
        run: python tools/v3/download_awv_full.py awv-full.json
      - name: Build OSM database
        run: python tools/v3/build_belgium_db.py belgium.osm.pbf belgium-osm.db
      - name: Build research candidate quality map
        run: python tools/v3/build_quality_map.py belgium-osm.db awv-full.json belgium-quality.db quality-report.json --workers 2 --checkpoint-every 25000
      - name: Validate candidate map
        run: python tools/v3/validate_quality_map.py belgium-osm.db belgium-quality.db --full > validation.json
      - name: Evaluate Dendermonde and Wieze anchors
        run: python tools/v3/evaluate_candidate_anchors.py belgium-quality.db tools/v3/probe-cases-20261012.json candidate-anchor-report.json
      - name: Upload candidate research reports
        uses: actions/upload-artifact@v4
        with:
          name: candidate-crosswalk-zone30-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-report.json
            validation.json
            candidate-anchor-report.json
          retention-days: 14

  regional_candidate:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'candidate-crosswalk-zone30')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download regional OSM XML
        run: curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 -o region.osm 'https://api.openstreetmap.org/api/0.6/map?bbox=4.075,50.976,4.097,51.036'
      - name: Download regional AWV snapshot
        run: python tools/v3/download_awv_region.py awv-region.json --bbox 4.075,50.976,4.097,51.036
      - name: Build regional OSM database
        run: python tools/v3/build_belgium_db.py region.osm region-osm.db
      - name: Build regional candidate
        run: python tools/v3/build_quality_map.py region-osm.db awv-region.json region-quality.db regional-quality-report.json --workers 1 --checkpoint-every 5000
      - name: Evaluate Dendermonde and Wieze anchors
        run: python tools/v3/evaluate_candidate_anchors.py region-quality.db tools/v3/probe-cases-20261012.json regional-anchor-report.json
      - name: Upload regional candidate report
        uses: actions/upload-artifact@v4
        with:
          name: regional-crosswalk-zone30-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            regional-quality-report.json
            regional-anchor-report.json
          retention-days: 14

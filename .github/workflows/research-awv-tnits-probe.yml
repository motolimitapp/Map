name: Research AWV TN-ITS evidence probe

on:
  push:
    branches:
      - main
    paths:
      - "tools/v3/probe_official_evidence.py"
      - "tools/v3/probe-cases-20261012.json"
      - "tools/v3/PROBE-README.md"
      - "tools/v3/enrich_awv.py"
      - "tests/v3/test_awv.py"
      - "tools/v3/awv_osm_crosswalk.py"
      - "tests/v3/test_crosswalk.py"
      - "tests/v3/test_ride_regressions.py"
      - "tests/v3/fixtures/ride-regressions-20261013.json"
      - "tools/v3/evaluate_ride_regressions.py"
      - "tools/v3/research_directional_evidence.py"
      - "tools/v3/annotate_research_crosswalk.py"
      - "tests/v3/test_directional_evidence.py"
      - "tools/v3/validate_live_crosswalk.py"
      - ".github/workflows/research-awv-tnits-probe.yml"
  pull_request:
    paths:
      - "tools/v3/probe_official_evidence.py"
      - "tools/v3/probe-cases-20261012.json"
      - "tools/v3/PROBE-README.md"
      - "tools/v3/enrich_awv.py"
      - "tests/v3/test_awv.py"
      - "tools/v3/awv_osm_crosswalk.py"
      - "tests/v3/test_crosswalk.py"
      - ".github/workflows/research-awv-tnits-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Run AWV and quality unit tests
        run: PYTHONPATH=tests/v3 python -m unittest tests.v3.test_awv tests.v3.test_quality tests.v3.test_crosswalk tests.v3.test_ride_regressions tests.v3.test_directional_evidence

  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check pyproj==3.8.0 shapely==2.1.2
      - name: Run read-only evidence probe
        id: probe
        continue-on-error: true
        run: python tools/v3/probe_official_evidence.py --config tools/v3/probe-cases-20261012.json --out probe-output > probe-output.log 2>&1
      - name: Show summary
        if: always()
        run: |
          cat probe-output.log || true
          test -f probe-output/summary.json && cat probe-output/summary.json || true
      - name: Upload raw evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awv-tnits-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            probe-output/**
            probe-output.log
          retention-days: 14
      - name: Fail if probe reported source errors
        if: steps.probe.outcome != 'success'
        run: exit 1

  live_crosswalk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install crosswalk dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download live MotoLimiet v3 map
        id: live_map
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view map-v3-live --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"status":"unavailable","reason":"map-v3-live GitHub Release does not exist yet"}' > live-crosswalk-report.json
            printf '%s\n' '{"status":"unavailable"}' > live-manifest.json
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          mkdir live-release
          gh release download map-v3-live --repo "$GITHUB_REPOSITORY" --dir live-release --pattern manifest.json --pattern 'belgium-limits-*.db.gz'
          cp live-release/manifest.json live-manifest.json
          map_asset=$(python -c 'import json, pathlib, urllib.parse; print(pathlib.PurePosixPath(urllib.parse.urlparse(json.load(open("live-manifest.json"))["url"]).path).name)')
          cp "live-release/$map_asset" live-map.db.gz
          python - <<'PYTHON'
          import gzip, shutil
          with gzip.open("live-map.db.gz","rb") as src, open("live-map.db","wb") as dst:
              shutil.copyfileobj(src,dst,1024*1024)
          PYTHON
      - name: Validate live Dendermonde and Wieze crosswalk
        if: steps.live_map.outputs.available == 'true'
        run: PYTHONPATH=tools/v3 python tools/v3/validate_live_crosswalk.py live-map.db tools/v3/probe-cases-20261012.json live-crosswalk-report.json
      - name: Upload live crosswalk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-crosswalk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-crosswalk-report.json
            live-manifest.json
          retention-days: 14

  candidate_build:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'candidate-crosswalk-zone30-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download current Belgium OSM extract
        run: curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 1800 --output belgium.osm.pbf https://download.geofabrik.de/europe/belgium-latest.osm.pbf
      - name: Download AWV snapshot
        run: python tools/v3/download_awv_full.py awv-full.json
      - name: Build OSM database
        run: python tools/v3/build_belgium_db.py belgium.osm.pbf belgium-osm.db
      - name: Build research candidate quality map
        run: python tools/v3/build_quality_map.py belgium-osm.db awv-full.json belgium-quality.db quality-report.json --workers 2 --checkpoint-every 25000
      - name: Validate candidate map
        run: python tools/v3/validate_quality_map.py belgium-osm.db belgium-quality.db --full > validation.json
      - name: Evaluate Dendermonde and Wieze anchors
        run: python tools/v3/evaluate_candidate_anchors.py belgium-quality.db tools/v3/probe-cases-20261012.json candidate-anchor-report.json
      - name: Upload candidate research reports
        uses: actions/upload-artifact@v4
        with:
          name: candidate-crosswalk-zone30-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            quality-report.json
            validation.json
            candidate-anchor-report.json
          retention-days: 14

  regional_candidate:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'candidate-crosswalk-zone30')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install v3 dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-v3.txt
      - name: Download small OSM XML windows
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 -o dendermonde.osm 'https://api.openstreetmap.org/api/0.6/map?bbox=4.086,51.029,4.096,51.035'
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 -o wieze.osm 'https://api.openstreetmap.org/api/0.6/map?bbox=4.078,50.977,4.089,50.984'
      - name: Download regional AWV snapshots
        run: |
          python tools/v3/download_awv_region.py awv-dendermonde.json --bbox 4.086,51.029,4.096,51.035
          python tools/v3/download_awv_region.py awv-wieze.json --bbox 4.078,50.977,4.089,50.984
      - name: Build small OSM databases
        run: |
          python tools/v3/build_belgium_db.py dendermonde.osm dendermonde-osm.db
          python tools/v3/build_belgium_db.py wieze.osm wieze-osm.db
      - name: Build regional candidates
        run: |
          python tools/v3/build_quality_map.py dendermonde-osm.db awv-dendermonde.json dendermonde-quality.db dendermonde-quality-report.json --workers 1 --checkpoint-every 5000
          python tools/v3/build_quality_map.py wieze-osm.db awv-wieze.json wieze-quality.db wieze-quality-report.json --workers 1 --checkpoint-every 5000
      - name: Evaluate Dendermonde and Wieze anchors
        run: |
          python tools/v3/evaluate_candidate_anchors.py dendermonde-quality.db tools/v3/probe-cases-20261012.json dendermonde-anchor-report.json
          python tools/v3/evaluate_candidate_anchors.py wieze-quality.db tools/v3/probe-cases-20261012.json wieze-anchor-report.json
      - name: Annotate topology-gated AWV evidence without changing speeds
        run: |
          PYTHONPATH=tools/v3 python tools/v3/annotate_research_crosswalk.py dendermonde-quality.db tools/v3/probe-cases-20261012.json dendermonde dendermonde-crosswalk-annotation.json
          PYTHONPATH=tools/v3 python tools/v3/annotate_research_crosswalk.py wieze-quality.db tools/v3/probe-cases-20261012.json wieze wieze-crosswalk-annotation.json
      - name: Upload regional candidate report
        uses: actions/upload-artifact@v4
        with:
          name: regional-crosswalk-zone30-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dendermonde-quality-report.json
            dendermonde-anchor-report.json
            wieze-quality-report.json
            wieze-anchor-report.json
            dendermonde-crosswalk-annotation.json
            wieze-crosswalk-annotation.json
          retention-days: 14
